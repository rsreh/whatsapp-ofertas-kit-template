# Deploy no Fly.io (https://fly.io)
# Dentro de recipes/node-cron: fly launch --no-deploy, depois fly deploy
app = "whatsapp-ofertas-node-cron"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TIMEZONE = "America/Sao_Paulo"
  SEND_HOUR = "9"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
