# Dispara o ciclo diário da sua aplicação.
#
# Configure em Settings → Secrets and variables → Actions:
#   SITE_URL      = https://seu-site.com
#   CRON_SECRET   = o mesmo valor do .env da aplicação
#
# O cron do GitHub é UTC e pode atrasar alguns minutos em horários de pico.
# A trava diária do kit evita envio duplicado.

name: Oferta do dia

on:
  schedule:
    # 12:00 UTC = 09:00 em America/Sao_Paulo (UTC-3)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Disparar ciclo
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Defina SITE_URL e CRON_SECRET nos secrets do repositório."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --retry 2 --retry-delay 10 \
            "$SITE_URL/api/cron" \
            -H "Authorization: Bearer $CRON_SECRET"
