version: 2

updates:
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /recipes/node-cron
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /recipes/nextjs-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
